# percorso-fe/nginx.conf
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: ogni path non-asset va a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy verso il mock-api per le chiamate /api/*
    location /api/ {
        proxy_pass http://mock-api:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache aggressivo per asset hashati di Vite
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}